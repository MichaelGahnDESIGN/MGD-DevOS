name: Release

# Bei einem Tag vX.Y.Z läuft zuerst die komplette CI (ci.yml: Analyse, Unit-Tests,
# sync_meta --check, Integrationstests auf macOS/Windows/Linux, Pakete). Nur wenn
# alles grün ist, hängt "publish" die Pakete aus diesem Lauf samt Skill-ZIP und
# SHA256SUMS.txt an das GitHub Release "MGD-DevOS X.Y.Z Status". Pakete sind unsigniert.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: Komplette CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Release veröffentlichen
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - name: Tag mit zentraler Version abgleichen
        id: meta
        run: |
          VERSION=$(jq -r .version src/assets/meta/version.json)
          STAGE=$(jq -r .stage src/assets/meta/version.json)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu assets/meta/version.json (${VERSION})." >&2
            exit 1
          fi
          echo "title=MGD-DevOS ${VERSION} ${STAGE}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: MGD-DevOS-*
          path: out
          merge-multiple: true
      - name: Skill als ZIP (inklusive LICENSE und NOTICE)
        run: |
          cd src
          test -f skill/LICENSE && test -f skill/NOTICE
          git archive --format=zip --prefix=mgd-devos-skill/ -o ../out/MGD-DevOS-Skill.zip HEAD:skill
      - name: Prüfsummen und Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --latest --title "${TITLE}" \
                 --notes-file ../src/.github/release-notes.md --repo "${GITHUB_REPOSITORY}"
          gh release edit "${GITHUB_REF_NAME}" --title "${TITLE}" --repo "${GITHUB_REPOSITORY}"
          gh release upload "${GITHUB_REF_NAME}" * --clobber --repo "${GITHUB_REPOSITORY}"

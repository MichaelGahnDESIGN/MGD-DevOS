name: Release

# Baut bei einem Tag v* alle Plattformen und hängt die Pakete samt
# SHA256SUMS.txt an das GitHub Release. Pakete sind unsigniert.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: dmg, path: dist/macos/MGD-DevOS.dmg, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MGD-DevOS-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: zip, path: MGD-DevOS-windows.zip, if-no-files-found: error }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf MGD-DevOS-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with: { name: tar, path: MGD-DevOS-linux.tar.gz, if-no-files-found: error }

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cp src/.github/release-notes.md release-notes.md
      - name: Skill als ZIP
        run: |
          cd src && git archive --format=zip --prefix=mgd-devos-skill/ -o ../out/MGD-DevOS-Skill.zip HEAD:skill
      - name: Prüfsummen und Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --latest --title "MGD-DevOS ${GITHUB_REF_NAME}" \
                 --notes-file ../release-notes.md --repo "${GITHUB_REPOSITORY}"
          gh release upload "${GITHUB_REF_NAME}" * --clobber --repo "${GITHUB_REPOSITORY}"

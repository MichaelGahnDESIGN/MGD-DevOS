name: CI

# Baut und prüft MGD-DevOS auf allen drei Zielplattformen: Analyse, Unit-Tests,
# zentrale Version (scripts/sync_meta.py --check), Integrationstests mit der
# echten App auf macOS, Windows und Linux sowie die Installer-Pakete.
# release.yml ruft diesen Workflow per workflow_call auf und veröffentlicht
# nur, wenn alles grün ist; die Pakete stammen dann aus genau diesem Lauf.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Zentrale Version und Metadaten aktuell
        run: python3 scripts/sync_meta.py --check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    name: macOS Build + DMG
    needs: analyze_test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Xcode-Version prüfen
        run: xcodebuild -version
      - name: Integrationstest (echte App, eingebettetes Dashboard)
        run: flutter test integration_test -d macos
      - name: App bauen und als DMG packen
        run: scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MGD-DevOS-macos
          path: dist/macos/MGD-DevOS.dmg
          if-no-files-found: error

  windows:
    name: Windows Build
    needs: analyze_test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Integrationstest (echte App, WebView2)
        run: flutter test integration_test -d windows
      - run: flutter build windows --release
      - name: Release-Ordner als ZIP packen
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath MGD-DevOS-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MGD-DevOS-windows
          path: MGD-DevOS-windows.zip
          if-no-files-found: error

  linux:
    name: Linux Build
    needs: analyze_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Linux-Desktop-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Integrationstest (echte App, Browser-Ausweichweg)
        run: xvfb-run -a flutter test integration_test -d linux
      - run: flutter build linux --release
      - name: Release-Bundle als TAR.GZ packen
        run: |
          tar -czf MGD-DevOS-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: MGD-DevOS-linux
          path: MGD-DevOS-linux.tar.gz
          if-no-files-found: error

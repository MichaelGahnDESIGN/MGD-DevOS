  <title>{{PROJEKTNAME}} · MGD-DevOS</title>
  <!--
    MGD-DevOS Projekt-Dashboard (Vorlage aus skill/dashboard/index.html).
    Eigenständige Datei: keine externen Abhängigkeiten, keine Netzwerkzugriffe, keine Telemetrie.
    Platzhalter in doppelten geschweiften Klammern füllt der Assistent mit geprüften Projektinformationen.
    Bereiche im Code: 1 Stil · 2 Oberfläche · 3 Speicher · 4 Menü · 5 Fenster · 6 Inhalte · 7 Einstellungen · 8 PIN-Sperre · 9 Start.
  -->
  <style>
    /* ===== 1 Stil: Farb-Tokens für Hell/Dunkel, danach Bausteine ===== */
    :root{color-scheme:light dark;--bg:#e9ecf1;--desk:#f4f6f9;--panel:#fff;--panel-2:#f3f5f8;--ink:#141821;--muted:#5f6878;--soft:#8b93a3;--line:#e1e4ea;--line-2:#d0d5dd;--grid:rgb(20 24 33 / .07);--accent:#10a37f;--accent-ink:#fff;--good:#0f8a63;--warn:#b45309;--risk:#c0262d;--edge:#b9c0cc;--shadow:0 1px 2px rgb(16 24 40 / .06),0 14px 34px rgb(16 24 40 / .12);--ring:0 0 0 3px color-mix(in srgb,var(--accent) 32%,transparent);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    html[data-theme="dark"]{--bg:#05070b;--desk:#0a0e15;--panel:#121824;--panel-2:#0e131d;--ink:#e6eaf2;--muted:#9aa4b5;--soft:#6c7688;--line:#1e2635;--line-2:#2a3445;--grid:rgb(255 255 255 / .05);--good:#34d399;--warn:#fbbf24;--risk:#f87171;--edge:#35425a;--shadow:0 0 0 1px rgb(255 255 255 / .03),0 18px 44px rgb(0 0 0 / .5)}
    @media(prefers-color-scheme:dark){html[data-theme="system"]{--bg:#05070b;--desk:#0a0e15;--panel:#121824;--panel-2:#0e131d;--ink:#e6eaf2;--muted:#9aa4b5;--soft:#6c7688;--line:#1e2635;--line-2:#2a3445;--grid:rgb(255 255 255 / .05);--good:#34d399;--warn:#fbbf24;--risk:#f87171;--edge:#35425a;--shadow:0 0 0 1px rgb(255 255 255 / .03),0 18px 44px rgb(0 0 0 / .5)}}
    *{box-sizing:border-box}[hidden]{display:none!important}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--ink);font:400 14px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
    button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
    a{color:var(--accent)}code{font:500 .86em var(--mono);background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 6px;border-radius:5px}
    :focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
    .label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
    .app{display:grid;height:100vh;grid-template-rows:40px 1fr 36px}
    /* Menüleiste */
    .menubar{display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--panel-2);border-bottom:1px solid var(--line);position:relative;z-index:1000}
    .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-right:8px;white-space:nowrap}.brand img{width:20px;height:20px;border-radius:5px}
    .mb{position:relative}
    .mb>button{height:28px;padding:0 10px;border:0;border-radius:7px;background:none;font-size:13px;color:var(--ink)}
    .mb>button:hover,.mb>button[aria-expanded="true"]{background:color-mix(in srgb,var(--ink) 8%,transparent)}
    .menu{position:absolute;top:32px;left:0;min-width:240px;padding:5px;margin:0;list-style:none;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow)}
    .menu .menu{top:-6px;left:100%;margin-left:4px}
    .menu li{position:relative}
    .mi{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;background:none;text-align:left;font-size:13px;color:var(--ink);white-space:nowrap}
    .mi:hover,.mi:focus-visible,.mi[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:none}
    .mi .k{margin-left:auto;color:var(--soft);font:500 11px var(--mono)}.mi .arrow{margin-left:auto;color:var(--soft)}
    .sep{height:1px;margin:5px 6px;background:var(--line)}
    .spacer{flex:1}
    .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border:1px solid var(--line-2);border-radius:999px;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);white-space:nowrap}
    .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
    .icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid transparent;border-radius:7px;background:none;color:var(--muted)}
    .icon-btn:hover{background:var(--panel);border-color:var(--line);color:var(--ink)}
    svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
    /* Arbeitsfläche und Fenster */
    .desk{position:relative;overflow:hidden;background-color:var(--desk);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:18px 18px}
    .win{position:absolute;display:flex;flex-direction:column;min-width:260px;min-height:160px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
    .win.focused{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2))}
    .win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
    .win-head{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);background:var(--panel-2);cursor:grab;user-select:none;touch-action:none}
    .win-head:active{cursor:grabbing}
    .win-head .t{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .win-head .icon-btn{width:26px;height:26px}
    .win-body{flex:1;overflow:auto;padding:16px 18px}
    .win-body.flush{padding:0}
    .win-body iframe{width:100%;height:100%;border:0;display:block;background:var(--panel)}
    .rz{position:absolute;touch-action:none}.rz.e{right:0;top:0;bottom:0;width:6px;cursor:ew-resize}.rz.s{left:0;right:0;bottom:0;height:6px;cursor:ns-resize}.rz.se{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
    .desk.dragging iframe{pointer-events:none}
    .snap-guide{position:absolute;background:var(--accent);opacity:.6;pointer-events:none;z-index:900}
    /* Inhalte */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
    .card p{margin:.2rem 0;overflow-wrap:anywhere}
    .kind{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:11.5px;font-weight:600}
    .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}.chip.neutral{color:var(--muted);background:color-mix(in srgb,var(--ink) 7%,transparent)}
    .tag{display:inline-block;padding:1px 8px;margin:2px 4px 0 0;border-radius:999px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line-2)}
    .warn-t{color:var(--warn)}.risk-t{color:var(--risk)}
    ul.list{margin:0;padding:0;list-style:none}ul.list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}ul.list li:first-child{border-top:0;padding-top:2px}
    ul.list li::before{content:"";flex:none;width:7px;height:7px;margin-top:7px;border-radius:50%;background:var(--warn)}
    .flow{position:relative;display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:44px 60px;align-items:start}
    .flow .card{z-index:1;position:relative}.n-stand{grid-column:1;grid-row:1}.n-next{grid-column:2;grid-row:1}.n-open{grid-column:3;grid-row:1}.n-risk{grid-column:3;grid-row:2}.n-safe{grid-column:1/span 2;grid-row:2}
    svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
    svg.edges path{fill:none;stroke:var(--edge);stroke-width:1.6}svg.edges path.hot{stroke:var(--accent);stroke-dasharray:4 5;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-18}}
    .note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
    .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em}
    textarea.edit{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);padding:10px 12px;font:13px/1.55 var(--mono)}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
    .button{height:32px;border:1px solid transparent;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:0 14px;font-weight:500;font-size:13px}
    .button:hover{filter:brightness(1.07)}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line-2)}.button.danger{background:var(--risk)}
    .button:disabled{opacity:.5;cursor:not-allowed}
    /* Einstellungen */
    .settings{display:grid;grid-template-columns:180px 1fr;height:100%}
    .settings nav{border-right:1px solid var(--line);padding:12px 8px;overflow:auto;background:var(--panel-2)}
    .settings nav button{display:block;width:100%;text-align:left;height:30px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--muted)}
    .settings nav button[aria-current="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);font-weight:600}
    .settings .content{overflow:auto;padding:16px 20px}
    .search{width:100%;height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;margin-bottom:10px}
    .sec{margin-bottom:22px}.sec h3{margin:0 0 10px;font-size:14px}
    .field{display:grid;gap:6px;margin-bottom:12px;font-size:12.5px;color:var(--muted);font-weight:500}
    .field select,.field input{height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);color:var(--ink);padding:0 10px;font-size:13.5px}
    .timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line-2)}
    .timeline li{position:relative;margin:0 0 14px 0;padding-left:12px}.timeline li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
    .timeline ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
    .credit{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
    .sym{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:700}
    .warnbox{border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:9px;padding:10px 12px;font-size:12.5px;margin:10px 0}
    .pin-in{letter-spacing:.5em;font:600 18px var(--mono);text-align:center;width:220px}
    /* Statusleiste mit Fenster-Dock und Pflicht-Footer */
    .statusbar{display:flex;align-items:center;gap:10px;padding:0 10px;border-top:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
    .dock{display:flex;gap:4px;overflow-x:auto;min-width:0}
    .dock button{height:24px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis}
    .dock button.min{opacity:.6;font-style:italic}.dock button.focused{color:var(--ink);border-color:var(--line-2)}
    .powered-by a{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 12px 0 4px;border:1px solid color-mix(in srgb,#cd1616 40%,var(--line));border-radius:999px;background:color-mix(in srgb,#cd1616 8%,var(--panel));color:var(--ink);text-decoration:none;font-weight:600;font-size:12px}
    .powered-by a:hover{border-color:#cd1616}.powered-by .by{color:var(--muted);font-weight:400;margin-right:-3px}.powered-by .mgd-logo{width:18px;height:18px;border-radius:5px;display:block}
    /* PIN-Sperre */
    .lock{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:color-mix(in srgb,var(--desk) 92%,transparent);backdrop-filter:blur(14px)}
    .lock .box{width:min(360px,calc(100% - 32px));text-align:center;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:26px;box-shadow:var(--shadow)}
    .lock img{width:44px;height:44px;border-radius:10px}
    .toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;background:#161b26;color:#fff;font-size:12.5px;z-index:6000}
    @media(max-width:760px){.flow{grid-template-columns:1fr;gap:12px}.flow .card{grid-column:1!important;grid-row:auto!important}svg.edges{display:none}.settings{grid-template-columns:1fr}.settings nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.settings nav button{width:auto;white-space:nowrap}.win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}.menubar .hide-s{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <!-- ===== 2 Oberfläche ===== -->

Systembrowser. Dateien außerhalb des Projektordners blockierte WebKit bereits vorher.","Dashboard-Tab mit Adressleiste (Pfad), Ladeanzeige, „Neu laden\", „Im Browser öffnen\", Hinweis bei blockierter Navigation und Fehlerseite mit „Erneut versuchen\".","Integrationstest auf macOS (echte App): lokale `index.html` lädt, Browser-Speicher funktioniert, Unterseiten im Projekt erlaubt, Dateien außerhalb und fremde Schemata gesperrt, Control-Plane-Dashboard inkl. Einstellungen über Neuladen. Läuft jetzt auch in der CI."]},{"version":"2.4.1","date":"2026-09-25","component":"Projektmanager-Skill","notes":["Dashboard-Vorlage: Verbindungslinien im Projektfluss werden jetzt auch in eingebetteten oder verdeckten Webviews sofort gezeichnet (vorher nur per `requestAnimationFrame`, das dort pausiert). In der MGD-DevOS-App auf macOS geprüft."]},{"version":"0.3.0","date":"2026-09-24","component":"App","notes":["Programm-Oberfläche im Stil einer Control Plane: schmale Icon-Leiste links, Titelleiste mit Statusanzeigen („Lokal\", „Adapter aus\"), Statusleiste unten (Projekte, letzter Scan, offene Dashboards, Pflicht-Hinweis „supported by: Michael Gahn DESIGN\").","Agentic Control Panel als echter Graph: Projekt → Gruppe → Eintrag mit Verbindungslinien, verschieb- und zoombar, Gruppen ein-/ausklappbar, große Gruppen starten eingeklappt; Inspektor rechts mit Status, Quelle und Zeitpunkt. Umschaltbar auf Liste.","Tastenkürzel (⌘ auf macOS, Strg auf Windows/Linux): 1/2/3 Bereiche, „,\" Einstellungen, W Tab schließen, R neu scannen, ⇧[ / ⇧] Tab wechseln.","Mindestfenstergröße 960 × 620 auf macOS, Windows und Linux; Startgröße 1280 × 800.","Fix: Leerzustände überliefen bei kleinen Fenstern."]},{"version":"2.4.0","date":"2026-09-24","component":"Projektmanager-Skill","notes":["Dashboard-Vorlage als Programm-Oberfläche (Control Plane): Titelleiste mit Status, Icon-Leiste mit echten Ansichten (Übersicht, Aufgaben & Risiken, Arbeitsweise, Skills, Dokumentation) statt toter Links, Projektfluss- Graph mit Verbindungslinien, ein-/ausklappbarer Inspektor, Statusleiste mit Pflicht-Footer. Tastatur: 1–5, I, „,\", Pfeiltasten, Esc; Deep-Links per `#ansicht`. Funktioniert als lokale Datei, in Sandbox-Vorschauen und ohne Browser-Speicher. Neue Akzentfarbe „MGD – Rot\". Platzhalter und Einstellungs-IDs unverändert.","Dashboard-Vorlage neu gestaltet: feinere Typografie (Gewichte 400/500/600, kleine Versal-Titel), Haarlinien statt kräftiger Rahmen, ruhige Karten, überarbeiteter Einstellungsdialog mit sauberen Auswahlfeldern, verfeinerter Pflicht-Footer, Fokusrahmen und Bewegung reduzieren berücksichtigt. Struktur, IDs und Platzhalter unverändert.","Dashboard-Vorlage: „Speichern\" und „Zurücksetzen\" in den Einstellungen funktionieren auch, wenn der Browser-Speicher gesperrt ist (Artefakt-Vorschau, eingebettete Webviews); die Einstellung gilt dann bis zum Schließen."]},{"version":"2.3.0","date":"2026-09-24","component":"Projektmanager-Skill","notes":["`MGD_AI-Thread` als zweiten verbindlichen Basis-Skill ergänzt. `/thread` sichert geprüfte Arbeit vor einer Übergabe im vorgesehenen Git-Remote, sofern Projektregeln und Berechtigungen dies erlauben.","Die bisher widersprüchlichen `mandatory`-Werte der vier wählbaren MGD-Kern-Skills im Katalog korrigiert.","MGD-DevOS-Architektur für eine lokale Flutter-Agentenzentrale mit Agentic-Control-Panel, Light/Dark-Modus, Akzentfarben, optionaler Sperre, Rechte-Adaptern und Local-first-Datenschutz ergänzt.","Sicheres Stripe-Spendenkonzept mit gehostetem Checkout, festen und freien Beträgen sowie klaren Grenzen für Belege, Rechnungen und Customer Portal dokumentiert.","Ablauf „Einrichten und Starten\" (Textbaustein und Install-Befehl oben in der README) mit neuem Schritt 8: Dashboard starten, Desktop-Verknüpfung nach Bestätigung, Einweisung.","Pflicht-Footer „supported by: Michael Gahn DESIGN\" mit Logo und Favicon in der Dashboard-Vorlage; Assistenten entfernen ihn nie.","`getsentry/XcodeBuildMCP` als Dritt-Skill (mit Sicherheits-Sca   <script>
  (function(){
    'use strict';
    var $=function(id){return document.getElementById(id)};
    var el=function(tag,attrs,html){var e=document.createElement(tag);for(var k in attrs||{}){if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}if(html!=null)e.innerHTML=html;return e};
    var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
    var META=window.MGD_META||{version:{version:'?',stage:''},versions:[],credits:{people:[],tools:[]}};
    var VERSION=META.version.version+' '+(META.version.stage||'');

    /* ===== 3 Speicher: localStorage kann gesperrt sein (Vorschau, Webview); dann gilt alles nur bis zum Schließen ===== */
    var mem={},storageOk=true;
    function load(k,f){try{var v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){storageOk=false;return k in mem?mem[k]:f}}
    function store(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){storageOk=false;return false}}
    function drop(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){storageOk=false}}
    function toast(msg){var t=el('div',{'class':'toast',role:'status',text:msg});document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
    // Alle lokalen Dateien teilen sich einen Speicherbereich. Projektbezogenes (Layout, Notizen, Entwürfe)
    // bekommt deshalb den Dateipfad als Zusatz; Darstellung und PIN gelten bewusst für alle Dashboards.
    var P=':'+location.pathname;
    var K={settings:'mgd-ai-projektmanager-settings',layout:'mgd-devos-layout'+P,notes:'mgd-devos-notes'+P,rules:'mgd-devos-rules'+P,credits:'mgd-devos-credits'+P,pin:'mgd-devos-pin'};

    // Projektdaten aus dem Template. Ein unersetzter Platzhalter zählt als "nicht eingerichtet".
    var DATA={},TEXT={};
    [].forEach.call($('data').content.querySelectorAll('[data-k]'),function(n){DATA[n.dataset.k]=n.innerHTML.trim();TEXT[n.dataset.k]=n.textContent.trim()});
    function filled(k){var v=DATA[k]||'';return v!==''&&!/^\x7b\x7b[A-Z0-9_]+\x7d\x7d$/.test(v)}
    function file(k){return filled(k)?TEXT[k]:''}

    /* ===== 7a Einstellungen: Darstellung ===== */
    var presets={codex:'#10a37f',claude:'#d97706',generic:'#2563eb',mgd:'#cd1616'};
    var defaults={theme:'system',accent:'codex',customAccent:'#10a37f',openTarget:'ask'};
    function readSettings(){return Object.assign({},defaults,load(K.settings,{})||{})}
    function applySettings(s){
      document.documentElement.dataset.theme=s.theme;
      document.documentElement.style.setProperty('--accent',s.accent==='custom'?s.customAccent:(presets[s.accent]||presets.codex));
    }

    /* ===== 5 Fenster: verschieben, Größe ändern, magnetisch einrasten, minimieren, maximieren, schließen ===== */
    var desk=$('desk'),dock=$('dock'),wins={},z=10,SNAP=12;
    var layout=load(K.layout,{});
    // Layout je Fenster (Position, Größe, Zustand) bleibt auch für geschlossene Fenster erhalten; "open" merkt,
    // was beim nächsten Start wieder geöffnet wird. Während des Wiederherstellens wird nicht gespeichert.
    var restoring=false;
    function saveLayout(){
      if(restoring)return;
      Object.keys(layout).forEach(function(id){if(!wins[id])layout[id].open=false});
      Object.keys(wins).forEach(function(id){var w=wins[id],e=w.el,max=e.classList.contains('max'),keep=max||w.min,old=layout[id]||{};
        layout[id]={x:keep?old.x:e.offsetLeft,y:keep?old.y:e.offsetTop,w:keep?old.w:e.offsetWidth,h:keep?old.h:e.offsetHeight,min:w.min,max:max,open:true}});
      store(K.layout,layout);
    }
    function focusWin(id){Object.keys(wins).forEach(function(k){wins[k].el.classList.toggle('focused',k===id)});if(wins[id]){wins[id].el.style.zIndex=++z}renderDock()}
    function renderDock(){
      dock.innerHTML='';
      Object.keys(wins).forEach(function(id){
        var w=wins[id],b=el('button',{type:'button',title:w.title,text:w.title});
        if(w.min)b.className='min';else if(w.el.classList.contains('focused'))b.className='focused';
        b.onclick=function(){if(w.min){restore(id)}else if(w.el.classList.contains('focused')){minimize(id)}else focusWin(id)};
        dock.appendChild(b);
      });
    }
    function minimize(id){var w=wins[id];w.min=true;w.el.hidden=true;w.el.classList.remove('focused');saveLayout();renderDock()}
    function restore(id){var w=wins[id];w.min=false;w.el.hidden=false;focusWin(id);saveLayout();redraw()}
    function toggleMax(id){wins[id].el.classList.toggle('max');saveLayout();redraw()}
    function closeWin(id){var w=wins[id];if(!w)return;w.el.remove();delete wins[id];saveLayout();renderDock()}

    // Magnetisches Einrasten: Kanten innerhalb von SNAP Pixeln an Arbeitsfläche und andere Fenster.
    function snap(id,r){
      var D={l:0,t:0,r:desk.clientWidth,b:desk.clientHeight},xs=[D.l,D.r],ys=[D.t,D.b];
      Object.keys(wins).forEach(function(k){if(k===id||wins[k].min)return;var e=wins[k].el;xs.push(e.offsetLeft,e.offsetLeft+e.offsetWidth);ys.push(e.offsetTop,e.offsetTop+e.offsetHeight)});
      function near(v,list){for(var i=0;i<list.length;i++)if(Math.abs(v-list[i])<=SNAP)return list[i];return null}
      var a;
      if(r.mode==='move'){
        if((a=near(r.x,xs))!=null)r.x=a;else if((a=near(r.x+r.w,xs))!=null)r.x=a-r.w;
        if((a=near(r.y,ys))!=null)r.y=a;else if((a=near(r.y+r.h,ys))!=null)r.y=a-r.h;

      c.people.forEach(function(p){box.insertAdjacentHTML('beforeend','<div class="credit"><div class="sym">'+esc((p.name||'?').charAt(0))+'</div><div><strong>'+esc(p.name)+'</strong><div class="note" style="margin:0">'+esc(p.role)+'</div>'+(p.links||[]).map(function(l){return /^https:\/\//.test(l)?'<a href="'+esc(l)+'" target="_blank" rel="noopener noreferrer">'+esc(l)+'</a>':''}).join(' ')+'</div></div>')});
      box.insertAdjacentHTML('beforeend','<p class="label" style="margin-top:16px">KI-Systeme, Werkzeuge, Bibliotheken, Schriften, Icons</p>');
      c.tools.forEach(function(t){box.insertAdjacentHTML('beforeend','<div class="credit"><div class="sym" title="'+esc(t.category)+'">'+esc((t.name||'?').charAt(0))+'</div><div><strong>'+esc(t.name)+'</strong> <span class="tag">'+esc(t.category)+'</span><div style="margin:2px 0">'+esc(t.description)+'</div><div class="note" style="margin:0">Anbieter: '+esc(t.provider)+(t.notice?' · '+esc(t.notice):'')+'</div>'+(t.links||[]).map(function(l){return /^https:\/\//.test(l)?'<a href="'+esc(l)+'" target="_blank" rel="noopener noreferrer">'+esc(l.replace(/^https:\/\//,''))+'</a>':''}).join(' · ')+'<div>'+(t.tags||[]).map(function(g){return '<span class="tag">'+esc(g)+'</span>'}).join('')+'</div></div></div>')});
      box.insertAdjacentHTML('beforeend','<details style="margin-top:14px"><summary>Credits bearbeiten (JSON)</summary><p class="note">Änderungen gelten für dieses Dashboard in diesem Browser. Dauerhaft: <code>assets/meta/credits.json</code> im MGD-DevOS-Repo.</p><textarea class="edit" aria-label="Credits als JSON"></textarea><div class="row"><button class="button" type="button" data-a="s">Übernehmen</button><button class="button secondary" type="button" data-a="r">Standard wiederherstellen</button></div></details>');
      var t=box.querySelector('textarea');t.value=JSON.stringify(c,null,2);
      box.querySelector('[data-a=s]').onclick=function(){try{var v=JSON.parse(t.value);normCredits(v);store(K.credits,normCredits(v));rerenderSettings('credits');toast('Credits übernommen')}catch(e){toast('Ungültig: '+e.message)}};
      box.querySelector('[data-a=r]').onclick=function(){drop(K.credits);rerenderSettings('credits');toast('Standard wiederhergestellt')};
    }
    function rerenderSettings(sec){settingsSection=sec;if(wins.settings){var b=wins.settings.el.querySelector('.win-body');renderSettings(b)}}

    /* ===== 8 PIN-Sperre: PBKDF2-SHA-256 mit Salz; gespeichert wird nur der Hash =====
       Hinweis: Die Sperre schützt vor Blicken am Bildschirm, nicht vor jemandem mit Dateizugriff,
       denn die Inhalte stehen im Klartext in dieser HTML-Datei. */
    var ITER=210000,subtle=window.crypto&&window.crypto.subtle;
    function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2)}).join('')}
    function hashPin(pin,saltHex){
      var salt=new Uint8Array(saltHex.match(/../g).map(function(h){return parseInt(h,16)}));
      return subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']).then(function(k){return subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:ITER},k,256)}).then(hex);
    }
    function safeEqual(a,b){if(a.length!==b.length)return false;var r=0;for(var i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
    // Nur gültige Datensätze zählen; ein beschädigter Eintrag gilt als "keine PIN" (wie in der App).
    function readPin(){var p=load(K.pin,null);return p&&[4,6,8].indexOf(p.len)>=0&&/^[0-9a-f]{32}$/.test(p.salt||'')&&/^[0-9a-f]{64}$/.test(p.hash||'')?p:null}
    function checkPin(pin){var p=readPin();if(!p)return Promise.resolve(true);return hashPin(pin,p.salt).then(function(h){return safeEqual(h,p.hash)})}
    function setPin(pin,len){var s=hex(crypto.getRandomValues(new Uint8Array(16)));return hashPin(pin,s).then(function(h){return store(K.pin,{len:len,salt:s,hash:h,iter:ITER})})}
    function validPin(pin,len){return new RegExp('^\\d{'+len+'}$').test(pin)}
    function secSecurity(box){
      var p=readPin();
      if(!subtle){box.innerHTML+='<p class="warnbox">Die PIN-Sperre braucht die Web-Crypto-Schnittstelle, die hier nicht verfügbar ist.</p>';return}
      load('mgd-devos-probe',null);store('mgd-devos-probe',1);drop('mgd-devos-probe');
      if(!storageOk){box.innerHTML+='<p class="warnbox">Der Browser-Speicher ist hier gesperrt. Eine PIN könnte nicht gespeichert werden.</p>';return}
      box.insertAdjacentHTML('beforeend','<p class="note">Sichtschutz: Die PIN verdeckt dieses Dashboard beim Öffnen vor neugierigen Blicken. Sie schützt nicht vor jemandem mit Zugriff auf dein Benutzerkonto oder die Datei (die Inhalte stehen im Klartext in der HTML-Datei), sperrt nicht automatisch bei Inaktivität und ersetzt nicht die Anmeldung am Rechner. Gespeichert wird nur ein Hash im Browser-Speicher.</p><p><span class="chip '+(p?'good':'neutral')+'">'+(p?'PIN aktiv ('+p.len+' Stellen)':'Keine PIN')+'</span></p>'+
        (p?'<label class="field">Aktuelle PIN<input data-f="cur" type="password" inputmode="numeric" autocomplete="off"></label>':'')+
        '<label class="field">Länge<select data-f="len"><option value="4">4 Stellen</option><option value="6">6 Stellen</option><option value="8">8 Stellen</option></select></label><label class="field">Neue PIN<input data-f="new" type="password" inputmode="numeric" autocomplete="new-password"></label><label class="field">Neue PIN wiederholen<input data-f="rep" type="password" inputmode="numeric" autocomplete="new-password"></label>'+
        '<p class="warnbox"><strong>Wichtig:</strong> Schreib dir die PIN auf oder speichere sie in deinem Passwort-Manager. Ohne PIN kommst du nur wieder hinein, wenn du den Browser-Speicher dieses Dashboards löschst (dabei gehen auch Notizen und Einstellungen verloren).</p>'+
        '<div class="row"><button class="button" type="button" data-a="set">'+(p?'PIN ändern':'PIN festlegen')+'</button>'+(p?'<button class="button danger" type="button" data-a="off">PIN deaktivieren</button>':'')+'</div><p class="note risk-t" data-f="msg" role="alert"></p>');
      var q=function(n){return box.querySelector('[data-f="'+n+'"]')},msg=q('msg');if(p)q('len').value=String(p.len);
      function withCurrent(fn){if(!p)return fn();var c=q('cur').value;if(!validPin(c,p.len)){msg.textContent='Bitte die aktuelle PIN eingeben.';return}checkPin(c).then(function(ok){if(!ok){msg.textContent='Aktuelle PIN ist falsch.';return}fn()})}
      box.querySelector('[data-a=set]').onclick=function(){
        var len=+q('len').value,n=q('new').value,r=q('rep').value;
        if(!validPin(n,len)){msg.textContent='Die PIN muss genau '+len+' Ziffern haben.';return}
        if(n!==r){msg.textContent='Die Wiederholung stimmt nicht überein.';return}
        withCurrent(function(){setPin(n,len).then(function(ok){toast(ok?'PIN gespeichert. Bitte sicher notieren!':'PIN konnte nicht gespeichert werden');rerenderSettings('sicherheit')})});
      };
      var off=box.querySelector('[data-a=off]');if(off)off.onclick=function(){withCurrent(function(){drop(K.pin);toast('PIN deaktiviert');rerenderSettings('sicherheit')})};
    }
    // Sperrbildschirm mit Wartezeit nach Fehlversuchen.
    // Fehlversuche und Wartezeit werden gespeichert, damit Neuladen die Wartezeit nicht aufhebt.
    var FAILS='mgd-devos-pin-fails',fl=load(FAILS,{n:0,until:0}),fails=fl.n||0,lockedUntil=fl.until||0;
    function showLock(){
      var p=readPin();if(!p||!subtle)return false;
      $('lock').hidden=false;$('app').setAttribute('inert','');$('lockVersion').textContent='MGD-DevOS '+VERSION;
      var input=$('lockPin');input.maxLength=p.len;input.value='';setTimeout(function(){input.focus()},0);
      var busy=false,btn=$('lockForm').querySelector('button');
      $('lockForm').onsubmit=function(e){
        e.preventDefault();if(busy)return;var now=Date.now();
        if(now<lockedUntil){$('lockMsg').textContent='Bitte '+Math.ceil((lockedUntil-now)/1000)+' s warten.';return}
        busy=true;btn.disabled=true;
        checkPin(input.value).then(function(ok){busy=false;btn.disabled=false;
          if(ok){fails=0;lockedUntil=0;drop(FAILS);$('lock').hidden=true;$('app').removeAttribute('inert');start();return}
          fails++;input.value='';if(fails>=5){lockedUntil=Date.now()+Math.min(30000*Math.pow(2,fails-5),3600000)}
          store(FAILS,{n:fails,until:lockedUntil});
          $('lockMsg').textContent='Falsche PIN'+(fails>=5?'. Zu viele Versuche, bitte warten.':'.');
        }).catch(function(){busy=false;btn.disabled=false;$('lockMsg').textContent='Prüfung fehlgeschlagen. Bitte erneut versuchen.'});
      };
      return true;
    }

    /* ===== 4 Menü: Untermenüs, Tastaturbedienung (Pfeile, Enter, Esc) ===== */
    var MENUS=[
      {label:'MGD-DevOS',items:[{label:'Über MGD-DevOS',win:'about'},{label:'Versionen',settings:'versionen'},{label:'Credits',settings:'credits'},'-',{label:'Einstellungen …',win:'settings',key:','}]},
      {label:'Projekt',items:[{label:'Projektfluss',win:'flow',key:'1'},{label:'Offene Tasks',win:'tasks',key:'2'},{label:'Arbeitsweise',win:'work'},{label:'Skills',win:'skills'}]},
      {label:'Öffnen',items:[
        {label:'Planung',sub:[{label:'Todo',win:'todo'},{label:'Offene Tasks',win:'tasks'},{label:'Fragenkatalog',win:'catalog'}]},
        {label:'Wissen',sub:[{label:'Dokumente',win:'docs'},{label:'Lebende Dokumentation',win:'living'},{label:'Notizen',win:'notes'}]},
        {label:'Überblick',sub:[{label:'Statistiken',win:'stats'},{label:'Arbeitende Agenten',win:'agents'},{label:'Projektfluss',win:'flow'}]}]},
      {label:'Fenster',items:[{label:'Nebeneinander anordnen',act:tile},{label:'Alle minimieren',act:function(){Object.keys(wins).forEach(minimize)}},{label:'Alle wiederherstellen',act:function(){Object.keys(wins).forEach(function(k){if(wins[k].min)restore(k)})}},'-',{label:'Aktives Fenster schließen',key:'W',act:function(){var f=document.querySelector('.win.focused:not([hidden])');if(f)closeWin(f.dataset.win)}},{label:'Alle schließen',act:function(){Object.keys(wins).forEach(closeWin)}}]},
      {label:'Einstellungen',items:[{label:'Darstellung',settings:'allg'},{label:'Grundregeln',settings:'regeln'},{label:'Sicherheit',settings:'sicherheit'},{label:'Fenster',settings:'fenster'},'-',{label:'Versionen',settings:'versionen'},{label:'Credits',settings:'credits'}]}
    ];
    var bar=$('menubar'),openMenu=null;
    function run(it){closeMenus();if(it.win)openWin(it.win);else if(it.settings){settingsSection=it.settings;if(wins.settings)rerenderSettings(it.settings);openWin('settings')}else if(it.act)it.act()}
    function buildList(items){
      var ul=el('ul',{'class':'menu',role:'menu'});ul.hidden=true;
      items.forEach(function(it){
        var li=el('li',{role:'none'});
        if(it==='-'){li.className='sep';li.setAttribute('role','separator');ul.appendChild(li);return}
        var b=el('button',{'class':'mi',type:'button',role:'menuitem',tabindex:'-1'},esc(it.label)+(it.sub?'<span class="arrow">›</span>':it.key?'<span class="k">'+esc(it.key)+'</span>':''));
        li.appendChild(b);
        if(it.sub){var sub=buildList(it.sub);li.appendChild(sub);b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');
          var show=function(){[].forEach.call(ul.querySelectorAll(':scope>li>.menu'),function(m){if(m!==sub){m.hidden=true;m.previousSibling.setAttribute('aria-expanded','false')}});sub.hidden=false;b.setAttribute('aria-expanded','true')};
          b.onmouseenter=show;b.onclick=function(){show();sub.querySelector('.mi').focus()};
          b.onkeydown=function(e){if(e.key==='ArrowRight'){e.preventDefault();show();sub.querySelector('.mi').focus()}};
          sub.onkeydown=function(e){if(e.key==='ArrowLeft'||e.key==='Escape'){e.preventDefault();e.stopPropagation();sub.hidden=true;b.setAttribute('aria-expanded','false');b.focus()}};
        }else{b.onclick=function(){run(it)};b.onmouseenter=function(){[].forEach.call(ul.querySelectorAll(':scope>li>.menu'),function(m){m.hidden=true})}}
        ul.appendChild(li);
      });
      ul.addEventListener('keydown',function(e){
        var list=[].slice.call(ul.querySelectorAll(':scope>li>.mi')),i=list.indexOf(document.activeElement);if(i<0)return;
        if(e.key==='ArrowDown'){e.preventDefault();list[(i+1)%list.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();list[(i-1+list.length)%list.length].focus()}
      });
      return ul;
    }
    function closeMenus(){[].forEach.call(bar.querySelectorAll('.menu'),function(m){m.hidden=true});[].forEach.call(bar.querySelectorAll('[aria-expanded]'),function(b){b.setAttribute('aria-expanded','false')});openMenu=null}
    MENUS.forEach(function(m,i){
      var wrap=el('div',{'class':'mb'}),b=el('button',{type:'button',role:'menuitem','aria-haspopup':'menu','aria-expanded':'false',text:m.label}),ul=buildList(m.items);
      if(i>0&&i<3)wrap.classList.add('hide-s');
      function open(focusFirst){closeMenus();ul.hidden=false;b.setAttribute('aria-expanded','true');openMenu=wrap;if(focusFirst)ul.querySelector('.mi').focus()}
      b.onclick=function(){if(openMenu===wrap)closeMenus();else open(false)};
      b.onmouseenter=function(){if(openMenu&&openMenu!==wrap)open(false)};
      b.onkeydown=function(e){if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();open(true)}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();var all=bar.querySelectorAll('.mb>button');all[(i+(e.key==='ArrowRight'?1:all.length-1))%all.length].focus()}};
      wrap.appendChild(b);wrap.appendChild(ul);bar.appendChild(wrap);
    });
    bar.appendChild(el('span',{'class':'spacer'}));
    var gear=el('button',{'class':'icon-btn',id:'settingsButton',type:'button','aria-label':'Einstellungen öffnen',title:'Einstellungen (,)'},'<svg class="i" viewBox="0 0 24 24">'+I.gear+'</svg>');gear.onclick=function(){openWin('settings')};bar.appendChild(gear);
    document.addEventListener('pointerdown',function(e){if(openMenu&&!bar.contains(e.target))closeMenus()});
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&openMenu){var top=openMenu.querySelector('.mb>button, :scope>button');closeMenus();if(top)top.focus();return}
      if(!$('lock').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
      var tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
      if(e.key===','){e.preventDefault();openWin('settings')}else if(e.key==='1'){openWin('flow')}else if(e.key==='2'){openWin('tasks')}
      else if(e.key==='w'||e.key==='W'){var f=document.querySelector('.win.focused:not([hidden])');if(f)closeWin(f.dataset.win)}
    });

    /* ===== Projektfluss-Linien: direkt und im nächsten Frame zeichnen (rAF pausiert in verdeckten Webviews) ===== */
    function drawEdges(){
      var svg=$('edges'),grid=$('flowGrid');if(!svg||!grid||!grid.offsetParent)return;
      var box=grid.getBoundingClientRect(),out='';
      [['n-stand','n-next',true],['n-next','n-open'],['n-next','n-risk']].forEach(function(e){
        var a=$(e[0]).getBoundingClientRect(),b=$(e[1]).getBoundingClientRect();if(!a.width||!b.width)return;
        var x1=a.right-box.left,y1=a.top-box.top+28,x2=b.left-box.left,y2=b.top-box.top+28,d;
        if(x2<x1+10){x1=a.left-box.left+a.width/2;y1=a.bottom-box.top;x2=b.left-box.left+b.width/2;y2=b.top-box.top;var my=(y1+y2)/2;d='M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+y2}
        else{var mx=(x1+x2)/2;d='M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2}
        out+='<path class="'+(e[2]?'hot':'')+'" d="'+d+'"/>';
      });
      svg.innerHTML=out;
    }
    function redraw(){drawEdges();requestAnimationFrame(drawEdges)}
    window.addEventListener('resize',redraw);

    /* ===== 9 Start ===== */
    function start(){
      if(start.done)return;start.done=true;
      var ids=Object.keys(layout).filter(function(id){return layout[id].open!==false&&VIEWS[id]});if(!ids.length)ids=['flow'];
      restoring=true;ids.forEach(openWin);restoring=false;saveLayout();
    }
    $('verLabel').textContent='MGD-DevOS '+VERSION+' · Stand '+TEXT.date;
    applySettings(readSettings());
    window.MGD_DASHBOARD={openWin:openWin,closeWin:closeWin,minimize:minimize,restore:restore,tile:tile,wins:wins,checkPin:checkPin};
    if(!showLock())start();
  })();
  </script>
</body>

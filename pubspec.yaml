name: mgd_devos
description: "MGD-DevOS: lokale Projektzentrale für Projekte, Living Documentation, Skills, MCP und Agenten."
# Nicht auf pub.dev veröffentlichen. Lizenz: MGD-Lizenz, siehe LICENSE.
publish_to: 'none'

# Wird von scripts/sync_meta.py aus assets/meta/version.json geschrieben (Version+Build), nicht von Hand ändern.
version: 0.6.0+10

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.3
  file_selector: ^1.0.3
  url_launcher: ^6.3.1
  path: ^1.9.0
  intl: ^0.20.2
  flutter_inappwebview: ^6.1.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo-64.png
    - assets/brand/icon-512.png
    - assets/meta/version.json
    - assets/meta/versions.json
    - assets/meta/credits.json
    - LICENSE

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
